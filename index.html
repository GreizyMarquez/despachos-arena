<title>Despachos Arena</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Despachos">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: black brand band on top, one column of task cards on phone; on desktop the office view uses a wide table. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#101318; --muted:#596372; --line:#DCE1E8; --soft:#E9EDF3;
  --accent:#0050B5; --accent-soft:#E3EDFB; --accent-ink:#FFFFFF;
  --band:#0B0C0E; --band-ink:#FFFFFF; --band-muted:#A5ADB8;
  --ok:#0C7F45; --ok-soft:#DFF3E8; --warn:#A85F00; --warn-soft:#FBEFD9; --bad:#BE2635; --bad-soft:#FBE3E5; --idle:#5E6876; --idle-soft:#E9ECF0;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F14; --surface:#151A21; --ink:#E8ECF2; --muted:#9AA4B2; --line:#28303B; --soft:#1C222B;
  --accent:#5A9DFF; --accent-soft:#16273F; --accent-ink:#06101F;
  --band:#000000; --band-ink:#FFFFFF; --band-muted:#8E97A3;
  --ok:#43C27F; --ok-soft:#10291C; --warn:#F0A742; --warn-soft:#2C2010; --bad:#FF6B76; --bad-soft:#331519; --idle:#9AA4B2; --idle-soft:#1F252E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F14; --surface:#151A21; --ink:#E8ECF2; --muted:#9AA4B2; --line:#28303B; --soft:#1C222B;
  --accent:#5A9DFF; --accent-soft:#16273F; --accent-ink:#06101F;
  --band:#000000; --band-ink:#FFFFFF; --band-muted:#8E97A3;
  --ok:#43C27F; --ok-soft:#10291C; --warn:#F0A742; --warn-soft:#2C2010; --bad:#FF6B76; --bad-soft:#331519; --idle:#9AA4B2; --idle-soft:#1F252E;
  color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
img{max-width:100%}
.pin{display:flex;gap:10px;justify-content:center}
.pin input{width:54px;height:62px;text-align:center;font-size:26px;font-family:var(--f-mono);border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* Brand band */
.band{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.band-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{height:38px;width:auto;flex:none;color:var(--band-ink)}
.brand-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-txt b{font-family:var(--f-display);font-stretch:118%;font-weight:800;letter-spacing:.02em;font-size:15px;text-transform:uppercase}
.brand-txt span{color:var(--band-muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch{margin-left:auto;display:flex;background:#1E2126;border-radius:999px;padding:3px;flex:none}
.switch button{border:0;background:transparent;color:var(--band-muted);padding:7px 13px;border-radius:999px;font-weight:600;font-size:13px}
.switch button[aria-pressed="true"]{background:var(--band-ink);color:var(--band)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--band-muted);flex:none}
.sync.on{background:#3DDC84}.sync.off{background:#FF5C66}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:24px;font-weight:800;font-stretch:112%;letter-spacing:-.01em}
h2{font-size:18px;font-weight:750;font-stretch:108%}
h3{font-size:15px;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}

/* Controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);min-height:36px;padding:6px 8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 11px;font-size:13px}
.btn svg{width:18px;height:18px;flex:none}
.input,select.input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:44px;width:100%}
textarea.input{min-height:72px;resize:vertical}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:650;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.count{font-family:var(--f-mono);font-size:12px;background:var(--soft);color:var(--muted);border-radius:999px;padding:1px 8px}
.tabs button[aria-selected="true"] .count{background:var(--ink);color:var(--bg)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-pendiente{background:var(--idle-soft);color:var(--idle)}
.st-reprog{background:var(--warn-soft);color:var(--warn)}
.st-en_ruta{background:var(--accent-soft);color:var(--accent)}
.st-entregado{background:var(--ok-soft);color:var(--ok)}
.st-noent{background:var(--bad-soft);color:var(--bad)}
.canal{display:inline-flex;align-items:center;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 7px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.canal.c-Falabella{border-color:#9BBF2A;color:#5C7A00}
.canal.c-Ripley{border-color:#7B5BA8;color:#5B3D86}
.group-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.group-row{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.group-row:last-child{border-bottom:0}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card-head{display:flex;gap:12px;align-items:flex-start}
.ord{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-weight:600}
.who{font-weight:700;font-size:16px;line-height:1.25}
.addr{font-size:14px}
.addr .dist{font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:12.5px}
.items{font-size:13px;color:var(--muted)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface);margin-top:2px}
.card.sel .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:16px;height:16px;opacity:0}.card.sel .check svg{opacity:1}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:13px;border-radius:8px;padding:8px 10px;background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:650}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--ink)}

/* Bottom action bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:30}
.bar-in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:28px;font-stretch:105%;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi.t-ok .v{color:var(--ok)}.kpi.t-route .v{color:var(--accent)}.kpi.t-bad .v{color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}

/* Table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.t{white-space:nowrap;font-family:var(--f-mono);font-size:12.5px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line);display:block;background:var(--soft)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:650;padding:0;text-decoration:underline;text-underline-offset:2px}

/* Bars (dashboard) */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(92px,130px) 1fr 56px;gap:10px;align-items:center;font-size:13px}
.bar-track{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:4px}
.bar-fill.ok{background:var(--ok)}.bar-fill.warn{background:var(--warn)}.bar-fill.bad{background:var(--bad)}
.bar-row .pct{text-align:right;font-family:var(--f-mono);font-weight:600}
.cols{display:flex;align-items:flex-end;gap:4px;height:130px;border-bottom:1px solid var(--line);padding-top:16px}
.col{flex:1;min-width:6px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.col i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.col span{font-size:10px;font-family:var(--f-mono);color:var(--muted)}
.cols-x{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--f-mono)}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(5,8,12,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:720px){.sheet{border-radius:16px;max-width:640px}}
.sheet.wide{max-width:900px}
.photo-drop{border:2px dashed var(--line);border-radius:12px;min-height:180px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:14px;position:relative;overflow:hidden}
.photo-drop img{max-width:100%;max-height:320px;border-radius:8px;display:block}
.photo-drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.full-img{max-width:100%;max-height:75vh;border-radius:10px;display:block;margin:0 auto}
.progress{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.imp-list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.imp-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center;font-size:13.5px}
.imp-row:last-child{border-bottom:0}
.imp-row input{width:18px;height:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px);font-size:14px}
.who-pick{display:grid;gap:10px}
.who-pick button{text-align:left;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;flex:none}
@media (max-width:560px){.hide-sm{display:none!important}.brand-txt span{display:none}}
@media (min-width:900px){.only-sm{display:none!important}}
@media (max-width:899px){.only-lg{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
"use strict";
const TZ='America/Lima';
const fmtD=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
const fmtH=new Intl.DateTimeFormat('es-PE',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false});
const dLocal=t=>fmtD.format(new Date(t));

const fechaCorta=ds=>{if(!ds)return'';const [y,m,d]=ds.split('-');return d+'/'+m+'/'+y};

/* ---------- data helpers ---------- */
function etiquetaEstado(p){
  if(p.estado==='entregado')return['Entregado','st-entregado'];
  if(p.estado==='en_ruta')return['En ruta','st-en_ruta'];
  if((p.intentos||0)>0)return['Reprogramado','st-reprog'];
  return['Por recoger','st-pendiente'];
}
function pill(p){const [t,c]=etiquetaEstado(p);return `<span class="pill ${c}">${t}</span>`}
function porRecoger(){const d=hoy();return [...S.pedidos.values()].filter(p=>p.estado==='pendiente'&&(p.fechaPlan||p.fechaCarga)<=d).sort(ordenUrg)}
function ordenRuta(a,b){return (a.distrito||'').localeCompare(b.distrito||'')||(a.order||'').localeCompare(b.order||'')}
const MKT=['Falabella','Ripley'];
const esMkt=p=>MKT.includes(p.canal);
function canalTag(p){return p.canal&&p.canal!=='VTEX'?`<span class="canal c-${esc(p.canal)}">${esc(p.canal)}</span>`:''}
function conDestino(p){
  if(!esMkt(p))return p;
  const pt=S.puntos[p.canal]||{};
  return {...p,receptor:p.canal+' · punto de entrega',direccion:pt.direccion||'Falta la dirección: configúrala en Oficina › Ajustes',complemento:'',distrito:pt.distrito||'San Isidro',ciudad:'Lima',referencia:pt.referencia||'',telefono:pt.telefono||''};
}
function ordenUrg(a,b){const x=a.fechaLimite||'9999',y=b.fechaLimite||'9999';return x<y?-1:x>y?1:ordenRuta(a,b)}
function limiteInfo(p){
  if(!p.fechaLimite)return null;
  const f=fechaCorta(p.fechaLimite).slice(0,5);
  if(p.estado==='entregado'&&p.entregadoAt){const ok=dLocal(p.entregadoAt)<=p.fechaLimite;return {t:ok?'A tiempo':'Fuera de plazo',c:ok?'st-entregado':'st-noent',f,ok}}
  const d=diffDays(hoy(),p.fechaLimite);
  if(d<0)return {t:'Vencido '+f,c:'st-noent',f,d};
  if(d===0)return {t:'Vence hoy',c:'st-reprog',f,d};
  if(d===1)return {t:'Vence mañana',c:'st-pendiente',f,d};
  return {t:'Hasta '+f,c:'st-pendiente',f,d};
}
function limitePill(p){const l=limiteInfo(p);return l?`<span class="pill ${l.c}">${l.t}</span>`:''}
function aTiempoTxt(p){if(!p.fechaLimite||!p.entregadoAt)return '';return dLocal(p.entregadoAt)<=p.fechaLimite?'Sí':'No'}
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const diaSem=ds=>new Date(ds+'T12:00:00Z').getUTCDay();
function semanaPorDefecto(){let d=addDays(hoy(),-1);while(diaSem(d)!==4)d=addDays(d,-1);return d}
function ultimaActividad(m){
  const d=hoy();let t=null;
  for(const {e} of eventosDe(d))if(e.m===m&&['recojo','entrega','no_entrega'].includes(e.tipo)&&(!t||e.t>t))t=e.t;
  for(const a of (S.avisos[d]||[]))if(a.m===m&&(!t||a.t>t))t=a.t;
  return t;
}
function enRuta(m){return [...S.pedidos.values()].filter(p=>p.estado==='en_ruta'&&(!m||p.motorizado===m)).sort((a,b)=>(a.salida||0)-(b.salida||0)||ordenUrg(a,b))}
function eventosDe(D){const r=[];for(const p of S.pedidos.values())for(const e of p.historial||[])if(dLocal(e.t)===D)r.push({p,e});r.sort((a,b)=>a.e.t<b.e.t?-1:1);return r}
function ultimoRecojoAntes(p,t){let r=null;for(const e of p.historial||[])if(e.tipo==='recojo'&&e.t<=t)r=e;return r}
function minutosEntrega(p,e){const r=ultimoRecojoAntes(p,e.t);return r?(Date.parse(e.t)-Date.parse(r.t))/60000:null}
function siguienteSalida(m){const d=hoy();let mx=0;for(const {e} of eventosDe(d))if(e.tipo==='recojo'&&e.m===m)mx=Math.max(mx,e.salida||0);return mx+1}

function resumenDia(D){
  const ev=eventosDe(D),porMoto={},llevados=[],entregas=[],noEnt=[];
  for(const x of ev){
    if(!['recojo','entrega','no_entrega'].includes(x.e.tipo))continue;
    const m=x.e.m||'Sin nombre';
    const pm=porMoto[m]||(porMoto[m]={m,ini:null,fin:null,salidas:new Set(),llevados:0,entregados:0,noEnt:0});
    if(x.e.tipo==='recojo'){llevados.push(x);pm.llevados++;pm.salidas.add(x.e.salida||1);if(!pm.ini||x.e.t<pm.ini)pm.ini=x.e.t}
    else if(x.e.tipo==='entrega'){entregas.push(x);pm.entregados++;if(!pm.fin||x.e.t>pm.fin)pm.fin=x.e.t}
    else if(x.e.tipo==='no_entrega'){noEnt.push(x);pm.noEnt++;if(!pm.fin||x.e.t>pm.fin)pm.fin=x.e.t}
  }
  for(const pm of Object.values(porMoto))pm.min=(pm.ini&&pm.fin&&pm.fin>pm.ini)?(Date.parse(pm.fin)-Date.parse(pm.ini))/60000:null;
  const sal={};
  for(const x of ev){
    if(!['recojo','entrega','no_entrega'].includes(x.e.tipo))continue;
    const k=(x.e.m||'Sin nombre')+'|'+(x.e.salida||1);
    const o=sal[k]||(sal[k]={m:x.e.m||'Sin nombre',n:x.e.salida||1,ini:null,fin:null,pedidos:0,entregados:0,noEnt:0});
    if(x.e.tipo==='recojo'){o.pedidos++;if(!o.ini||x.e.t<o.ini)o.ini=x.e.t}
    else{if(x.e.tipo==='entrega')o.entregados++;else o.noEnt++;if(!o.fin||x.e.t>o.fin)o.fin=x.e.t}
  }
  const salidas=Object.values(sal).filter(o=>o.ini).sort((a,b)=>a.m.localeCompare(b.m)||a.n-b.n);
  for(const o of salidas)o.min=(o.fin&&o.fin>o.ini)?(Date.parse(o.fin)-Date.parse(o.ini))/60000:null;
  const pendientes=[],cargados=[];
  for(const p of S.pedidos.values()){
    if(p.fechaCarga===D)cargados.push(p);
    const ent=p.entregadoAt&&dLocal(p.entregadoAt)<=D;
    if(p.fechaCarga<=D&&!ent)pendientes.push(p);
  }
  pendientes.sort(ordenRuta);
  return {ev,porMoto,llevados,entregas,noEnt,pendientes,cargados,salidas};
}
function pedidosDelDia(D){
  const ids=new Set();
  for(const p of S.pedidos.values()){
    if(p.fechaCarga===D)ids.add(p.id);
    if(D===hoy()&&p.estado!=='entregado'&&(p.fechaPlan||p.fechaCarga)<=D)ids.add(p.id);
  }
  for(const {p} of eventosDe(D))ids.add(p.id);
  return [...ids].map(id=>S.pedidos.get(id)).filter(Boolean);
}
function estadoEnDia(p,D){
  const evs=(p.historial||[]).filter(e=>dLocal(e.t)===D);
  const last=[...evs].reverse().find(e=>['recojo','entrega','no_entrega'].includes(e.tipo));
  if(D===hoy())return etiquetaEstado(p);
  if(!last)return p.entregadoAt&&dLocal(p.entregadoAt)<=D?['Entregado','st-entregado']:['Sin salir','st-pendiente'];
  if(last.tipo==='entrega')return['Entregado','st-entregado'];
  if(last.tipo==='no_entrega')return['No entregado','st-noent'];
  return['En ruta al cierre','st-en_ruta'];
}
function waLink(tel,txt){let d=String(tel||'').replace(/\D/g,'');if(d.length===9)d='51'+d;return d?`https://wa.me/${d}?text=${encodeURIComponent(txt)}`:''}
function dirTxt(p){return [p.direccion,p.distrito,p.ciudad||'Lima','Perú'].filter(Boolean).join(', ')}
function wazeLink(p){return 'https://waze.com/ul?q='+encodeURIComponent(dirTxt(p))+'&navigate=yes'}
function mapsLink(p){const q=[p.direccion,p.distrito,p.ciudad,'Perú'].filter(Boolean).join(', ');return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}
function telDisp(t){return String(t||'').replace(/^\+?51/,'').replace(/(\d{3})(\d{3})(\d{3})/,'$1 $2 $3')}

/* ---------- writes ---------- */
async function actualizar(p,campos,evento){
  const hist=[...(p.historial||[]),...(evento?[evento]:[])];
  const datos={...campos,historial:hist,actualizado:nowISO()};
  S.pedidos.set(p.id,{...p,...datos});
  // Firestore guarda primero en el celular y sube cuando hay señal: no esperamos al servidor
  S.db.doc('pedidos/'+p.id).update(datos).catch(e=>toast(errMsg(e)));
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}
function errMsg(e){
  const c=e&&e.code;
  if(c==='permission-denied')return 'La base no permitió guardar. Revisa las reglas de Firestore en tu proyecto.';
  if(c==='resource-exhausted')return 'Se alcanzó el límite diario gratuito de Firebase. Vuelve a intentarlo mañana.';
  if(c==='not-found')return 'Ese pedido ya no existe en la base.';
  return 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.';
}

  const a=document.activeElement,fid=a&&a.id,ss=a&&a.selectionStart;

  document.getElementById('v-ofi').setAttribute('aria-pressed',S.view==='ofi');
  document.getElementById('subtitle').textContent=S.view==='moto'?(S.me?S.me+' · '+fechaLarga(hoy()):'Pedidos del motorizado'):'Oficina · Arena Perú';
  const sy=document.getElementById('sync');sy.className='sync '+(S.online===true?'on':S.online===false?'off':'');
  sy.title=S.online===true?'Conectado':S.online===false?'Sin conexión con la base':'Conectando';
  if(!S.ready){renderBar('');return}
  if(!S.db){app.innerHTML=`<div class="empty"><h3>No se pudo conectar con la base de pedidos</h3><p>${esc(S.setupError||'Revisa tu conexión a internet y vuelve a abrir la app.')}</p></div>`;renderBar('');return}
  if(S.view==='ofi'&&!S.ofiOk){app.innerHTML=vPin();renderBar('');const i=document.getElementById('pin0');if(i&&!fid)i.focus();return}
  app.innerHTML=S.view==='moto'?vMoto():vOfi();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(ss!=null)el.setSelectionRange(ss,ss)}catch(e){}}}
}

/* PIN de Oficina */
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('arena-despachos:'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function vPin(){
  if(!S.cfgLoaded)return `<div class="empty"><h3>Cargando…</h3></div>`;
  const nuevo=!S.pinHash;
  return `<section class="panel" style="max-width:420px;margin:24px auto 0;text-align:center;gap:16px">
    <div><div class="eyebrow">Oficina</div><h1>${nuevo?'Crea el PIN de Oficina':'Ingresa el PIN'}</h1>
    <p class="muted" style="margin:6px 0 0;font-size:14px">${nuevo?'4 dígitos. Con este PIN entras a cargar pedidos, ver reportes y descargar el Excel. El motorizado no lo necesita.':'La vista de Oficina está protegida. El motorizado no necesita PIN.'}</p></div>
    <form data-form="pin"><div class="pin">${[0,1,2,3].map(i=>`<input id="pin${i}" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Dígito ${i+1}" data-act="pinIn" data-i="${i}">`).join('')}</div>
    <button class="btn primary" type="submit" style="width:100%;margin-top:16px">${nuevo?'Guardar PIN':'Entrar'}</button></form>
    <button class="btn ghost" data-act="view" data-v="moto">Volver a Motorizado</button></section>`;
}

/* Motorizado */
function vMoto(){
  if(S.readOnly&&!S.me){}
  if(!S.me||!S.motos.includes(S.me)){
    renderBar('');
    const lista=S.motos.length?S.motos:[];
    return `<section class="panel"><div><div class="eyebrow">Antes de empezar</div><h1>¿Quién está haciendo la ruta?</h1></div>
      ${lista.length?`<div class="who-pick">${lista.map(m=>`<button data-act="soy" data-m="${esc(m)}"><span class="avatar">${esc(m.trim()[0]||'?').toUpperCase()}</span>${esc(m)}</button>`).join('')}</div>`
      :`<div class="empty"><h3>Aún no hay motorizados registrados</h3><p>En Oficina › Motorizados agrega los nombres.</p><button class="btn" data-act="view" data-v="ofi">Ir a Oficina</button></div>`}
      <p class="muted" style="margin:0;font-size:13px">Este celular recordará tu nombre. Puedes cambiarlo cuando quieras.</p></section>`;
  }
  const rec=porRecoger(),mios=enRuta(S.me),d=hoy();
  const entHoy=eventosDe(d).filter(x=>x.e.tipo==='entrega'&&x.e.m===S.me).reverse();
  const noHoy=eventosDe(d).filter(x=>x.e.tipo==='no_entrega'&&x.e.m===S.me).reverse();
  const futuros=[...S.pedidos.values()].filter(p=>p.estado==='pendiente'&&(p.fechaPlan||'')>d).length;
  const tab=S.motoTab;
  let body='';
  if(tab==='recoger'){
    for(const id of [...S.sel])if(!rec.find(p=>p.id===id))S.sel.delete(id);
    body=rec.length?`<div class="row spread"><span class="muted" style="font-size:13px">Marca los pedidos que te llevas en esta salida.</span>
      <button class="btn ghost sm" data-act="selAll">${S.sel.size===rec.length?'Quitar todos':'Seleccionar todos'}</button></div>
      <div class="list">${rec.map(cardRecoger).join('')}</div>`
      :`<div class="empty"><h3>No hay pedidos por recoger</h3><p>Cuando la oficina cargue los pedidos del día aparecerán aquí.</p></div>`;
    if(futuros)body+=`<p class="muted" style="font-size:13px;margin:0">${futuros} pedido${futuros>1?'s':''} reprogramado${futuros>1?'s':''} para otro día.</p>`;
    renderBar(S.sel.size?`<div class="bar-in"><div class="grow"><b>${S.sel.size} pedido${S.sel.size>1?'s':''}</b><div class="muted" style="font-size:13px">Salida ${siguienteSalida(S.me)} de hoy</div></div><button class="btn primary" data-act="salidaAsk">${IC.truck}Me los llevo</button></div>`:'');
  }else if(tab==='ruta'){
    renderBar('');
    const grupos=MKT.map(c=>mios.filter(p=>p.canal===c)).filter(g=>g.length);
    body=mios.length?`<div class="list">${grupos.map(cardGrupo).join('')}${mios.filter(p=>!esMkt(p)).map(cardRuta).join('')}</div>`:`<div class="empty"><h3>No tienes pedidos en ruta</h3><p>Ve a “Por recoger”, marca los que te llevas y toca “Me los llevo”.</p></div>`;
  }else if(tab==='horas'){
    renderBar('');
    body=vMisHoras();
  }else{
    renderBar('');
    const all=[...entHoy.map(x=>({...x,k:'e'})),...noHoy.map(x=>({...x,k:'n'}))].sort((a,b)=>a.e.t<b.e.t?1:-1);
    body=all.length?`<div class="list">${all.map(x=>`<div class="card"><div class="card-head"><div class="grow"><div class="ord">${esc(x.p.order)} · Salida ${x.e.salida||'—'}</div><div class="who">${esc(x.p.receptor||x.p.cliente)}</div><div class="addr"><span class="dist">${esc(x.p.distrito)}</span></div></div>
      ${x.k==='e'?`<span class="pill st-entregado">${hLocal(x.e.t)}</span>`:`<span class="pill st-noent">No entregado ${hLocal(x.e.t)}</span>`}</div>
      ${x.k==='n'?`<div class="note bad">${esc(x.e.motivo)}${x.e.para?' · Reprogramado para el '+fechaCorta(x.e.para):''}</div>`:`<div class="meta"><span>Tiempo <b>${durTxt(minutosEntrega(x.p,x.e))}</b></span><span>${x.p.foto?'Con foto':'Sin foto'}</span>${x.e.obs?`<span>${esc(x.e.obs)}</span>`:''}</div>`}</div>`).join('')}</div>`
      :`<div class="empty"><h3>Aún no hay entregas hoy</h3><p>Lo que entregues aparecerá aquí con la hora.</p></div>`;
  }
  return `<div class="row spread"><div><div class="eyebrow">${esc(fechaLarga(d))}</div><h1>Hola, ${esc(S.me.split(' ')[0])}</h1></div><button class="btn ghost sm" data-act="cambiarMoto">Cambiar</button></div>
  ${mios.some(p=>p.fechaLimite&&p.fechaLimite<=d)?`<div class="note bad">Tienes ${mios.filter(p=>p.fechaLimite&&p.fechaLimite<=d).length} pedido(s) en ruta que vencen hoy o ya vencieron. Entrégalos primero.</div>`:''}
  ${S.readOnly?'<div class="note bad">Solo puedes ver los pedidos. Para marcar recojos y entregas, la oficina debe invitarte por correo como Editor.</div>':''}
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="${tab==='recoger'}" data-act="motoTab" data-t="recoger">Por recoger <span class="count">${rec.length}</span></button>
    <button role="tab" aria-selected="${tab==='ruta'}" data-act="motoTab" data-t="ruta">En ruta <span class="count">${mios.length}</span></button>
    <button role="tab" aria-selected="${tab==='hechos'}" data-act="motoTab" data-t="hechos">Hoy <span class="count">${entHoy.length}</span></button>
    <button role="tab" aria-selected="${tab==='horas'}" data-act="motoTab" data-t="horas">Mis horas</button>

function tablaDia(lista,D){
  const rows=lista.map(p=>{

    <div class="meta">${r.rec?`<span>${esc(r.rec.m)} · S${r.rec.salida||1}</span><span>Recojo <b>${hLocal(r.rec.t)}</b></span>`:''}${r.ent?`<span>Entrega <b>${hLocal(r.ent.t)}</b></span><span>Tiempo <b>${durTxt(r.min)}</b></span>`:''}</div>
    ${r.no?`<div class="note bad">${esc(r.no.motivo)}${r.no.obs?' · '+esc(r.no.obs):''}${r.no.para?' · para el '+fechaCorta(r.no.para):''}</div>`:''}
    <div class="row">${r.foto}<div class="grow"></div><button class="btn ghost sm" data-act="detalle" data-id="${esc(r.p.id)}">Detalle</button></div></div>`).join('')}</div>`;
  const table=`<div class="tbl-wrap only-lg"><table><thead><tr><th>Pedido</th><th>Cliente / destino</th><th>Estado</th><th>Motorizado</th><th>Recojo</th><th>Entrega</th><th>Tiempo</th><th>Límite VTEX</th><th>Foto / obs.</th><th></th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="t">${esc(r.p.order)}${r.p.canal&&r.p.canal!=='VTEX'?'<br>'+canalTag(r.p):''}</td><td><b>${esc(r.p.receptor||r.p.cliente)}</b><br><span class="muted">${esc(r.p.distrito)} · ${esc(r.p.direccion)}</span>${r.no?`<br><span style="color:var(--bad);font-size:12.5px">${esc(r.no.motivo)}${r.no.para?' · para el '+fechaCorta(r.no.para):''}</span>`:''}</td>
    <td><span class="pill ${r.c}">${r.t}</span></td><td>${r.rec?esc(r.rec.m)+'<br><span class="muted">Salida '+(r.rec.salida||1)+'</span>':'<span class="muted">—</span>'}</td>
    <td class="t">${r.rec?hLocal(r.rec.t):''}</td><td class="t">${r.ent?hLocal(r.ent.t):''}</td><td class="t">${r.ent?durTxt(r.min):''}</td><td>${r.p.fechaLimite?`<span class="t">${fechaCorta(r.p.fechaLimite).slice(0,5)}</span><br>${limitePill(r.p)}`:'<span class="muted">—</span>'}</td><td>${r.foto}</td>

    for(const e of p.historial||[]){

      if(e.tipo==='no_entrega'){if(d>=ini&&d<=fin){noe.push({p,e});motivos[e.motivo||'Otro']=(motivos[e.motivo||'Otro']||0)+1;const k=d+'|'+e.m;(jornadas[k]=jornadas[k]||{ini:null,fin:null});if(!jornadas[k].fin||e.t>jornadas[k].fin)jornadas[k].fin=e.t;(motos[e.m]=motos[e.m]||{n:0,no:0,min:[]}).no++}previoNo=true;continue}
      if(e.tipo==='recojo'&&d>=ini&&d<=fin){const k=d+'|'+e.m;(jornadas[k]=jornadas[k]||{ini:null,fin:null});if(!jornadas[k].ini||e.t<jornadas[k].ini)jornadas[k].ini=e.t}
      if(e.tipo!=='entrega'||d<ini||d>fin)continue;
      const min=minutosEntrega(p,e),dd=diffDays(p.fechaCarga,d);
      ent.push({p,e,min,dd,primer:!previoNo});
      dias[d]=(dias[d]||0)+1;
      const mm=motos[e.m]=motos[e.m]||{n:0,no:0,min:[]};mm.n++;if(min!=null)mm.min.push(min);
      const cn=p.canal||'VTEX';const cc=canales[cn]=canales[cn]||{n:0,min:[]};cc.n++;if(min!=null)cc.min.push(min);
      const ds=(p.distrito||'Sin distrito').trim().toUpperCase();const di=distr[ds]=distr[ds]||{n:0,min:[]};di.n++;if(min!=null)di.min.push(min);
      const k=d+'|'+e.m;(jornadas[k]=jornadas[k]||{ini:null,fin:null});if(!jornadas[k].fin||e.t>jornadas[k].fin)jornadas[k].fin=e.t;
    }
  }
  const N=ent.length;
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
  const mins=ent.map(x=>x.min).filter(x=>x!=null);
  const B=[['Menos de 1 h',0,60,'ok'],['1 a 2 h',60,120,'ok'],['2 a 3 h',120,180,''],['3 a 4 h',180,240,'warn'],['Más de 4 h',240,1e9,'bad']];
  const bucket=B.map(([l,a,b,c])=>({l,c,n:mins.filter(m=>m>=a&&m<b).length}));
  const dd=[['Mismo día de carga',x=>x.dd<=0,'ok'],['Al día siguiente',x=>x.dd===1,''],['2 días después',x=>x.dd===2,'warn'],['3 días o más',x=>x.dd>=3,'bad']].map(([l,f,c])=>({l,c,n:ent.filter(f).length}));
  const jl=Object.values(jornadas).filter(j=>j.ini&&j.fin&&j.fin>j.ini).map(j=>(Date.parse(j.fin)-Date.parse(j.ini))/60000);
  const bars=(arr,tot)=>`<div class="bars">${arr.map(x=>`<div class="bar-row"><span>${esc(x.l)}</span><div class="bar-track"><div class="bar-fill ${x.c||''}" style="width:${pct(x.n,tot)}%"></div></div><span class="pct">${pct(x.n,tot)}%</span></div>`).join('')}</div>`;
  const diasArr=[];for(let i=S.rango-1;i>=0;i--){const d=addDays(fin,-i);diasArr.push([d,dias[d]||0])}
  const mx=Math.max(1,...diasArr.map(x=>x[1]));
  const motivoArr=Object.entries(motivos).sort((a,b)=>b[1]-a[1]).map(([l,n])=>({l,n,c:'bad'}));
  const distArr=Object.entries(distr).sort((a,b)=>b[1].n-a[1].n).slice(0,8);
  if(!N&&!noe.length)return `<div class="row"><div class="chips">${[7,30,90].map(r=>`<button class="chip" aria-pressed="${S.rango===r}" data-act="rango" data-r="${r}">Últimos ${r} días</button>`).join('')}</div></div>
    <div class="empty"><h3>Todavía no hay entregas en este periodo</h3><p>Cuando el motorizado marque entregas, aquí verás qué porcentaje se entrega en menos de 1 hora, de 1 a 2 horas, y así.</p></div>`;
  return `<div class="row"><div class="chips">${[7,30,90].map(r=>`<button class="chip" aria-pressed="${S.rango===r}" data-act="rango" data-r="${r}">Últimos ${r} días</button>`).join('')}</div><span class="muted" style="font-size:13px">${fechaCorta(ini)} – ${fechaCorta(fin)}</span></div>
  <div class="kpis">
    <div class="kpi t-ok"><span class="v num">${N}</span><span class="l">Entregas</span></div>
    <div class="kpi"><span class="v num">${pct(N,N+noe.length)}%</span><span class="l">Efectividad (entregados / intentos)</span></div>
    <div class="kpi"><span class="v num">${pct(ent.filter(x=>x.primer).length,N)}%</span><span class="l">Entregados al primer intento</span></div>
    ${ent.some(x=>x.p.fechaLimite)?`<div class="kpi t-ok"><span class="v num">${pct(ent.filter(x=>x.p.fechaLimite&&dLocal(x.e.t)<=x.p.fechaLimite).length,ent.filter(x=>x.p.fechaLimite).length)}%</span><span class="l">Dentro del plazo VTEX</span></div>`:''}
    <div class="kpi t-route"><span class="v num">${hmm(avg(mins))||'—'}</span><span class="l">Tiempo promedio recojo → entrega</span></div>
    <div class="kpi"><span class="v num">${hmm(avg(jl))||'—'}</span><span class="l">Jornada promedio por día</span></div>
  </div>
  <div class="grid2">
    <section class="panel"><div><h2>Tiempo de entrega</h2><p class="muted" style="margin:2px 0 0;font-size:13px">Desde que el motorizado recoge hasta que marca entregado · ${mins.length} entregas</p></div>${bars(bucket,mins.length)}</section>
    <section class="panel"><div><h2>Días desde la carga</h2><p class="muted" style="margin:2px 0 0;font-size:13px">Cuántos días pasaron entre el Excel del día y la entrega</p></div>${bars(dd,N)}</section>
    <section class="panel"><div><h2>Entregas por día</h2></div><div class="cols">${diasArr.map(([d,n])=>`<div class="col" title="${fechaCorta(d)}: ${n}">${S.rango<=30&&n?`<span>${n}</span>`:''}<i style="height:${n/mx*100}%"></i></div>`).join('')}</div><div class="cols-x"><span>${fechaCorta(ini).slice(0,5)}</span><span>${fechaCorta(fin).slice(0,5)}</span></div></section>
    <section class="panel"><div><h2>Por motorizado</h2></div><div class="tbl-wrap" style="border:0"><table><thead><tr><th>Motorizado</th><th>Entregas</th><th>No entregados</th><th>Efectividad</th><th>Tiempo prom.</th></tr></thead><tbody>
      ${Object.entries(motos).map(([m,x])=>`<tr><td><b>${esc(m)}</b></td><td class="t">${x.n}</td><td class="t">${x.no}</td><td class="t">${pct(x.n,x.n+x.no)}%</td><td class="t">${durTxt(avg(x.min))}</td></tr>`).join('')}</tbody></table></div></section>
    ${Object.keys(canales).length>1?`<section class="panel"><div><h2>Entregas por canal</h2></div><div class="tbl-wrap" style="border:0"><table><thead><tr><th>Canal</th><th>Entregas</th><th>% del total</th><th>Tiempo prom.</th></tr></thead><tbody>

    <section class="panel"><div><h2>Distritos con más entregas</h2></div><div class="tbl-wrap" style="border:0"><table><thead><tr><th>Distrito</th><th>Entregas</th><th>% del total</th><th>Tiempo prom.</th></tr></thead><tbody>
      ${distArr.map(([d,x])=>`<tr><td>${esc(d)}</td><td class="t">${x.n}</td><td class="t">${pct(x.n,N)}%</td><td class="t">${durTxt(avg(x.min))}</td></tr>`).join('')}</tbody></table></div></section>

  </div>`;
}

/* ---------- import ---------- */
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('No se pudo cargar '+src));document.head.appendChild(s)})}
let xlsxP=null,exceljsP=null;
const needXLSX=()=>window.XLSX?Promise.resolve():xlsxP||(xlsxP=loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'));
const needExcelJS=()=>window.ExcelJS?Promise.resolve():exceljsP||(exceljsP=loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'));
const norm=s=>String(s||'').replace(/^﻿/,'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const ALIAS={
  order:['order','pedido','nropedido','npedido','numeropedido','nrodepedido','numerodepedido','orden','idpedido','orderid','ordenid','codigopedido'],
  nombre:['clientname','nombre','nombres','cliente','nombrecliente','nombredelcliente','nombreapellido','nombreyapellido','nombresyapellidos','nombreyapellidos'],
  canal:['metododepago','canal','marketplace','tienda','origendeventa','canaldeventa'],
  desc:['descripcion','descripciondelproducto','nombredelproducto'],
  apellido:['clientlastname','apellido','apellidos'],
  telefono:['phone','telefono','celular','movil','tel','telefonocliente','whatsapp'],
  street:['street','direccion','calle','address','direcciondeentrega'],
  number:['number','numero','nro','numerocasa'],
  complemento:['complement','complemento','dpto','interior','departamentointerior'],
  distrito:['neighborhood','distrito','barrio','urbanizacion'],
  ciudad:['city','ciudad','provincia'],
  depto:['uf','departamento','region'],
  referencia:['reference','referencia','ref'],
  receptor:['receivername','receptor','recibe','destinatario','quienrecibe','nombrereceptor'],
  sku:['skuname','producto','articulo','item','productos','sku','codigo'],
  qty:['quantitysku','cantidad','qty','unidades','cant'],
  total:['totalvalue','total','monto','importe','montototal','valortotal'],
  fecha:['creationdate','fecha','fechapedido','fechadecreacion','fechadeventa'],
  estado:['status','estado','estadopedido','estatus'],
  courier:['courrier','courier','transportista','tipodeenvio'],
  sla:['slatype','tipodeentrega','modalidad'],
  limite:['estimatedeliverydate','fechalimite','fechalimitedeentrega','fechaestimada','fechaestimadadeentrega','fechadeentrega','fechaentrega','entregarhasta']
};
function mapHeaders(hs){const m={};const nh=hs.map(norm);for(const [k,al] of Object.entries(ALIAS)){const i=nh.findIndex(h=>al.includes(h));if(i>=0)m[k]=hs[i]}return m}
function aFecha(raw){
  raw=String(raw||'').trim();if(!raw)return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(raw))return raw;
  const m=raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m)return (m[3].length===2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  const t=Date.parse(raw.replace(' ','T'));return isNaN(t)?'':dLocal(t);
}
async function leerArchivo(file){
  await needXLSX();
  let wb;
  if(/\.(csv|txt)$/i.test(file.name)){
    let txt=await file.text();txt=txt.replace(/^﻿/,'');
    const first=txt.split(/\r?\n/,1)[0]||'';
    const FS=(first.split(';').length>first.split(',').length)?';':((first.split('\t').length>first.split(',').length)?'\t':',');
    wb=XLSX.read(txt,{type:'string',FS,raw:true});
  }else{
    wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  }
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
  if(!rows.length)throw new Error('El archivo no tiene filas.');
  const H=mapHeaders(Object.keys(rows[0]));

    const o=v('order');if(!o)continue;

    const key=canal+'|'+o;

}

async function fotoChica(file){
  let src,w,h;
  try{src=await createImageBitmap(file);w=src.width;h=src.height}
  catch(e){const img=new Image();const u=URL.createObjectURL(file);img.src=u;await img.decode();src=img;w=img.naturalWidth;h=img.naturalHeight;setTimeout(()=>URL.revokeObjectURL(u),1000)}
  // ~80 KB por foto: alcanza para miles de entregas dentro del plan gratuito
  for(const [max,q] of [[1000,.6],[800,.5],[640,.45],[480,.4]]){
    const k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
    c.getContext('2d').drawImage(src,0,0,c.width,c.height);
    const du=c.toDataURL('image/jpeg',q);if(du.length<180000)return du;
  }
  throw new Error('foto muy pesada');
}

/* ---------- Horas semanales (viernes a jueves) ---------- */
function datosSemana(fin){
  const ini=addDays(fin,-6),dias=[];for(let i=0;i<7;i++)dias.push(addDays(ini,i));
  const porMoto={};
  for(const D of dias){
    if(D>hoy())continue;
    const R=resumenDia(D);
    for(const m of Object.values(R.porMoto)){
      const pm=porMoto[m.m]||(porMoto[m.m]={m:m.m,dias:{},total:0,entregas:0,salidas:0,incompletos:0});
      pm.dias[D]={ini:m.ini,fin:m.fin,min:m.min,salidas:m.salidas.size,entregados:m.entregados,noEnt:m.noEnt,detalle:R.salidas.filter(o=>o.m===m.m)};
      if(m.min!=null)pm.total+=m.min;else pm.incompletos++;
      pm.entregas+=m.entregados;pm.salidas+=m.salidas.size;
    }
  }
  return {ini,fin,dias,motos:Object.values(porMoto).sort((a,b)=>a.m.localeCompare(b.m))};
}

async function descargarSemana(){
  toast('Preparando Excel…');
  try{await needExcelJS()}catch(e){toast('No se pudo preparar el Excel. Revisa tu conexión.');return}
  const W=datosSemana(S.semFin||semanaPorDefecto());
  const wb=new ExcelJS.Workbook();wb.creator='Arena Perú';
  const NEGRO='FF0B0C0E',AZUL='FF0050B5',GRIS='FFF1F3F6';
  const ws=wb.addWorksheet('Horas semana',{views:[{showGridLines:false}]});
  ws.columns=[{width:14},{width:12},{width:14},{width:15},{width:12},{width:12},{width:30},{width:11}];
  ws.mergeCells('A1:H1');ws.getCell('A1').value='ARENA PERÚ · Horas del motorizado';ws.getCell('A1').font={bold:true,size:16,name:'Arial',color:{argb:'FFFFFFFF'}};ws.getCell('A1').fill={type:'pattern',pattern:'solid',fgColor:{argb:NEGRO}};ws.getRow(1).height=30;ws.getCell('A1').alignment={vertical:'middle',indent:1};
  ws.mergeCells('A2:H2');ws.getCell('A2').value=`Semana del viernes ${fechaCorta(W.ini)} al jueves ${fechaCorta(W.fin)}`;ws.getCell('A2').font={size:11,name:'Arial',color:{argb:'FF596372'}};
  let r=4;
  for(const pm of W.motos){
    ws.getCell('A'+r).value=pm.m.toUpperCase();ws.getCell('A'+r).font={bold:true,name:'Arial',size:12,color:{argb:AZUL}};r++;
    ['Día','Fecha','Primer recojo','Última entrega','Horas (h:mm)','Horas (decimal)','Salidas (hora de recojo)','Entregas'].forEach((h,i)=>{const c=ws.getRow(r).getCell(i+1);c.value=h;c.font={bold:true,color:{argb:'FFFFFFFF'},name:'Arial',size:10};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NEGRO}};c.alignment={wrapText:true,vertical:'middle'}});ws.getRow(r).height=28;
    const r0=r+1;r++;
    for(const D of W.dias){
      const x=pm.dias[D],row=ws.getRow(r);
      row.values=[DIAS[diaSem(D)],fechaCorta(D),x?hLocal(x.ini):'',x&&x.fin?hLocal(x.fin):'',x&&x.min!=null?x.min/1440:null,null,x?x.detalle.map(o=>'Salida '+o.n+': '+hLocal(o.ini)).join(' · '):'',x?x.entregados:null];
      row.getCell(5).numFmt='[h]:mm';row.getCell(6).value={formula:`IF(E${r}="","",ROUND(E${r}*24,2))`};row.getCell(6).numFmt='0.00';
      row.font={name:'Arial',size:10};if((r-r0)%2===1)row.eachCell({includeEmpty:true},c=>c.fill={type:'pattern',pattern:'solid',fgColor:{argb:GRIS}});
      r++;
    }
    const t=ws.getRow(r);t.getCell(1).value='TOTAL SEMANA';t.getCell(5).value={formula:`SUM(E${r0}:E${r-1})`};t.getCell(5).numFmt='[h]:mm';t.getCell(6).value={formula:`ROUND(E${r}*24,2)`};t.getCell(6).numFmt='0.00';t.getCell(8).value={formula:`SUM(H${r0}:H${r-1})`};
    t.font={bold:true,name:'Arial',size:11};t.eachCell({includeEmpty:true},c=>{c.border={top:{style:'thin',color:{argb:NEGRO}}}});
    r+=3;
  }
  ws.getCell('A'+r).value='Horas = desde el primer recojo hasta la última entrega o intento de cada día (incluye regresos a almacén entre salidas).';ws.getCell('A'+r).font={italic:true,size:9,name:'Arial',color:{argb:'FF596372'}};
  const buf=await wb.xlsx.writeBuffer();
  bajar(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`Horas_Motorizado_${W.ini}_a_${W.fin}.xlsx`);
}

render();
function mezclar(){
  const m=new Map();for(const [k,v] of (S._B||[]))m.set(k,conDestino(v));for(const [k,v] of (S._A||[]))m.set(k,conDestino(v));
  S.pedidos=m;render();if(S.sheet&&S.sheet.k==='detalle')renderSheet();
}
function suscribirHist(){
  if(S._offB)S._offB();
  const desde=addDays(hoy(),-(S.histDias+1));
  S._offB=S.db.collection('pedidos').where('actualizado','>=',desde).onSnapshot({includeMetadataChanges:true},snap=>{
    S._B=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]));S.online=!snap.metadata.fromCache;mezclar();
  },e=>{S.online=false;render();toast(errMsg(e))});
  for(let i=0;i<=Math.min(S.histDias,45);i++)escucharAvisos(addDays(hoy(),-i));
}
function ensureHist(n){if(!S.db||n<=S.histDias)return;S.histDias=Math.min(Math.max(n,8),400);suscribirHist()}
const _avisosOn=new Set();
function escucharAvisos(d){
  if(_avisosOn.has(d)||!S.db)return;_avisosOn.add(d);
  S.db.doc('config/avisos-'+d).onSnapshot(snap=>{
    const prev=(S.avisos[d]||[]).length,lista=snap.exists?(snap.data().lista||[]):[];
    S.avisos[d]=lista;
    if(S._avisosListos&&S.view==='ofi'&&d===hoy()&&lista.length>prev){const a=lista[lista.length-1];toast(`${a.m}: ${a.respuesta}`)}
    render();
  },()=>{});
  setTimeout(()=>S._avisosListos=true,5000);
}
async function boot(){
  if(!window.firebase||!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey==='PEGAR_AQUI'){
    S.setupError=!window.firebase?'No se pudo cargar Firebase. Revisa tu conexión a internet.':'Falta pegar la configuración de Firebase en el archivo index.html (bloque FIREBASE_CONFIG).';
    S.ready=true;render();return}
  let db;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.firestore();
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    const auth=firebase.auth();
    const u=await new Promise(r=>{const off=auth.onAuthStateChanged(x=>{off();r(x)})});
    if(!u)await auth.signInAnonymously();
  }catch(e){
    S.setupError=(e&&e.code==='auth/operation-not-allowed')?'Activa el inicio de sesión Anónimo en Firebase › Authentication › Método de acceso.':(e&&e.code==='auth/network-request-failed')?'Sin conexión. Abre la app con internet la primera vez.':'Firebase respondió: '+((e&&e.code)||e);
    S.ready=true;render();return}
  S.db=db;S.ready=true;render();
  db.doc('config/general').onSnapshot(snap=>{const d=snap.exists?snap.data():{};S.motos=d.motorizados||[];S.pinHash=d.pinHash||null;S.puntos=d.puntos||{};S.cfgLoaded=true;mezclar()},e=>{S.cfgLoaded=true;toast(errMsg(e))});
  // 1) pedidos que siguen abiertos (por recoger o en ruta), sin importar la fecha
  db.collection('pedidos').where('estado','in',['pendiente','en_ruta']).onSnapshot(snap=>{
    S._A=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]));mezclar();
  },e=>{S.online=false;render();toast(errMsg(e))});
  // 2) historial reciente (lo que se movió en los últimos días); se amplía al pedir fechas más antiguas
  suscribirHist();
  // 3) avisos del motorizado de hoy
  escucharAvisos(hoy());
  setInterval(()=>{revisarInactividad();if(S.view==='ofi'&&S.ofiTab==='dia'&&!S.sheet&&!document.activeElement.matches('input,textarea'))render()},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();setTimeout(revisarInactividad,1500)}});
  setTimeout(revisarInactividad,4000);
  window.addEventListener('online',()=>{S.online=true;render()});
  window.addEventListener('offline',()=>{S.online=false;render()});
  if(navigator.serviceWorker)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
})();
</script>
</body>
</html>
